<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background with squircle safe padding -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer subtle circular border -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-dasharray="12 8" />

  <!-- Serving Cloche & Chef Hat Icon Group -->
  <g filter="url(#shadow)">
    <!-- Serving Platter Base -->
    <path d="M 120 360 L 392 360 C 404 360 412 368 412 376 C 412 384 404 392 392 392 L 120 392 C 108 392 100 384 100 376 C 100 368 108 360 120 360 Z" fill="#ffffff" opacity="0.95" />
    <path d="M 150 392 L 362 392 L 340 408 L 172 408 Z" fill="rgba(0,0,0,0.15)" />

    <!-- Cloche Dome -->
    <path d="M 136 348 C 136 230 200 176 256 176 C 312 176 376 230 376 348 Z" fill="#ffffff" />
    
    <!-- Steam / Warmth Flame -->
    <path d="M 256 130 C 248 148 244 158 244 168 C 244 176 250 182 256 182 C 262 182 268 176 268 168 C 268 158 264 148 256 130 Z" fill="url(#goldGrad)" />
    <path d="M 216 142 C 210 156 208 164 208 170 C 208 176 212 180 216 180 C 220 180 224 176 224 170 C 224 164 222 156 216 142 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M 296 142 C 290 156 288 164 288 170 C 288 176 292 180 296 180 C 300 180 304 176 304 170 C 304 164 302 156 296 142 Z" fill="url(#goldGrad)" opacity="0.85" />

    <!-- Cloche Handle Top Knob -->
    <circle cx="256" cy="180" r="14" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3" />

    <!-- Arabic Calligraphic Touch / Heart -->
    <path d="M 256 260 C 246 244 224 246 224 266 C 224 286 256 312 256 312 C 256 312 288 286 288 266 C 288 246 266 244 256 260 Z" fill="#ea580c" />
  </g>
</svg>
